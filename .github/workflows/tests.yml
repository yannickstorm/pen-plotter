name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python3 tests/test_studio.py
      - name: Hosted copy builds
        run: python3 build_artifact.py "$RUNNER_TEMP/studio-artifact.html"
