name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets
      - name: Bridge (checkpoint and resume against a simulated GRBL)
        run: python3 tests/test_bridge.py
      - name: Plot Studio (headless Chrome)
        run: python3 tests/test_studio.py
