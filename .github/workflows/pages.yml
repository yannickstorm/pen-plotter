name: Plot Studio site

# One workflow for the hosted Plot Studio (studio.html with the Great Wave example embedded):
#  · push to main      → deploys to GitHub Pages (the branch gh-pages, root)
#  · pull request      → deploys a preview to <pages url>/pr-preview/pr-<number>/ and comments the link;
#                        a new push to the same PR cancels the running build and starts again;
#                        closing the PR removes the preview
#  · v* tag, or a run with a release tag → also publishes a release with the single-file page and
#                        plotter-bridge.tar.gz (the bridge for the Raspberry Pi, studio.html included)
#
# Pages must be set to "Deploy from a branch → gh-pages / (root)" in the repository settings.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v1.0.0); leave empty to only deploy'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

# one run per pull request (a newer push cancels the older one); deploys from main and tags queue instead
concurrency:
  group: pages-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the page
        run: |
          mkdir -p _site
          python3 build_artifact.py _site/index.html
          # the page's "Save offline copy" button fetches this file
          cp _site/index.html _site/plot-studio.html
          touch _site/.nojekyll
      - name: Check the scripts
        run: |
          python3 -m py_compile server.py send.py build_artifact.py bridge/bridge.py
          node .github/scripts/check_page.mjs _site/index.html
      - name: Package the bridge
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p dist/plotter-bridge
          cp bridge/bridge.py bridge/monitor.html bridge/install.sh bridge/README.md studio.html dist/plotter-bridge/
          if [[ "$TAG" == v* ]]; then
            sed -i "s/^VERSION = .*/VERSION = '${TAG#v}'/" dist/plotter-bridge/bridge.py
          fi
          chmod +x dist/plotter-bridge/install.sh dist/plotter-bridge/bridge.py
          tar -czf dist/plotter-bridge.tar.gz -C dist plotter-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: plot-studio
          path: _site/plot-studio.html
      - uses: actions/upload-artifact@v4
        with:
          name: plotter-bridge
          path: dist/plotter-bridge.tar.gz

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: pr-preview/   # keep the open pull requests' previews

  preview:
    # forks only get a read-only token, so they cannot publish a preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          action: deploy

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: rossjrw/pr-preview-action@v1
        with:
          action: remove

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plot-studio
      - uses: actions/download-artifact@v4
        with:
          name: plotter-bridge
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$TAG" plot-studio.html plotter-bridge.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Pen Plotter $TAG" --generate-notes
