<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plot Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;700&family=Pacifico&family=Bebas+Neue&family=Playfair+Display:wght@400;700&family=Roboto+Slab:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f12; --panel: #15181d; --panel-2: #1b1f26; --raise: #232832;
    --line: #2a303a; --line-2: #363d49;
    --fg: #eceff4; --muted: #8a93a3; --faint: #5b6372;
    --accent: #8b7bff; --accent-2: #b4a9ff; --accent-ink: #0d0b1f;
    --ok: #3ddc97; --warn: #ffb547; --danger: #ff5c6c;
    --paper: #fbfaf6; --mat: #101317; --bedfill: #1a1e24; --grid: rgba(40, 50, 80, .07);
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.35);
    --radius: 14px;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eceef2; --panel: #ffffff; --panel-2: #f5f6f9; --raise: #eef0f4;
      --line: #e1e4ea; --line-2: #d0d5de;
      --fg: #161a22; --muted: #5f6878; --faint: #9aa2b1;
      --accent: #5b47f5; --accent-2: #4636d6; --accent-ink: #ffffff;
      --mat: #dfe2e8; --bedfill: #cfd3db;
      --shadow: 0 1px 2px rgba(20,25,40,.06), 0 8px 24px rgba(20,25,40,.06);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
      --bg: #eceef2; --panel: #ffffff; --panel-2: #f5f6f9; --raise: #eef0f4;
      --line: #e1e4ea; --line-2: #d0d5de;
      --fg: #161a22; --muted: #5f6878; --faint: #9aa2b1;
      --accent: #5b47f5; --accent-2: #4636d6; --accent-ink: #ffffff;
      --mat: #dfe2e8; --bedfill: #cfd3db;
      --shadow: 0 1px 2px rgba(20,25,40,.06), 0 8px 24px rgba(20,25,40,.06);
      color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
  .brand-mark { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none;
    background: linear-gradient(135deg, var(--accent), #ff7ab6); color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 40%, transparent); }
  .brand h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .brand small { display: block; color: var(--muted); font-size: 11.5px; margin-top: -1px; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .chip.idle i { background: var(--ok); } .chip.run i { background: var(--accent); animation: pulse 1s infinite; }
  .chip.hold i, .chip.busy i { background: var(--warn); } .chip.alarm i { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .4; } }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 9px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--line-2); background: var(--raise); font-weight: 500; font-size: 12.5px; text-decoration: none;
    transition: background .15s, border-color .15s, transform .05s; }
  .btn:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line-2)); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--raise); }
  .btn.danger { color: var(--danger); }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
  .btn.icon { width: 28px; padding: 0; }
  .btn.block { width: 100%; }
  .btn svg { width: 15px; height: 15px; flex: none; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 270px minmax(0, 1fr) 330px; min-height: 0; }
  .left, .right { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .left { border-right: 1px solid var(--line); overflow: auto; }
  .right { border-left: 1px solid var(--line); }
  .sect { padding: 14px; border-bottom: 1px solid var(--line); }
  .sect-h { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .sect-h .grow { flex: 1; }
  .sect-h small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); }

  .list { display: flex; flex-direction: column; gap: 4px; }
  .obj { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
  .obj:hover { background: var(--panel-2); }
  .obj.on { background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .obj .ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--raise); color: var(--muted); flex: none; }
  .obj .ic svg { width: 14px; height: 14px; }
  .obj .nm { flex: 1; min-width: 0; }
  .obj .nm b { display: block; font-weight: 500; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .obj .nm span { font-size: 11px; color: var(--faint); }
  .obj .eye { opacity: .5; } .obj .eye:hover { opacity: 1; }
  .obj.hid .nm { opacity: .45; }
  .empty { padding: 14px; border: 1.5px dashed var(--line-2); border-radius: 12px; color: var(--muted); font-size: 12px; text-align: center; }
  .empty b { display: block; color: var(--fg); font-size: 13px; margin-bottom: 4px; }

  .pen { border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); padding: 8px; }
  .pen-top { display: flex; align-items: center; gap: 8px; }
  .pen-top input[type=color] { width: 26px; height: 26px; border: 0; padding: 0; border-radius: 7px; background: none; cursor: pointer; flex: none; }
  .pen-top input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .pen-top input[type=color]::-webkit-color-swatch { border: 1px solid var(--line-2); border-radius: 7px; }
  .pen-top .pname { flex: 1; min-width: 0; height: 26px; border: 1px solid transparent; background: none; border-radius: 6px; padding: 0 6px; font-weight: 500; }
  .pen-top .pname:hover, .pen-top .pname:focus { border-color: var(--line-2); background: var(--panel); outline: none; }
  .pen-num { font: 600 11px var(--mono); color: var(--faint); width: 14px; text-align: center; }
  .pen-meta { font-size: 11px; color: var(--faint); margin: 4px 0 0 22px; font-family: var(--mono); }
  .pen-more { display: none; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .pen.open .pen-more { display: grid; }
  .pen.off { opacity: .55; }

  .stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .canvas-wrap { position: relative; flex: 1; min-height: 0; background: var(--mat); overflow: hidden; }
  .canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .canvas-wrap.drop { outline: 2px dashed var(--accent); outline-offset: -8px; }
  .hud { position: absolute; display: flex; gap: 6px; align-items: center; }
  .hud.tl { left: 12px; top: 12px; pointer-events: none; }
  .hud.tr { right: 12px; top: 12px; }
  .hud.bl { left: 12px; bottom: 12px; right: 12px; flex-wrap: wrap; }
  .pill { padding: 5px 10px; border-radius: 8px; font: 11.5px var(--mono); color: var(--muted);
    background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--line); white-space: nowrap; }
  .pill b { color: var(--fg); font-weight: 500; }
  .tools { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--line); }
  .tools button { height: 28px; min-width: 28px; padding: 0 8px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .tools button:hover { color: var(--fg); background: var(--raise); }
  .tools button.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .tools button svg { width: 15px; height: 15px; }
  .sim { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px; padding: 3px 10px 3px 3px; }
  .sim input { flex: 1; margin: 0; }
  .busy { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: none; }
  .busy.show { display: block; }
  .busy .pill { color: var(--accent); }

  .statusbar { display: flex; gap: 18px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); overflow-x: auto; white-space: nowrap; }
  .statusbar b { color: var(--fg); font: 500 12px var(--mono); }
  .statusbar .warn { color: var(--warn); }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 12px 12px 0; }
  .tab { padding: 8px 0; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; border-radius: 9px; }
  .tab:hover { background: var(--panel-2); color: var(--fg); }
  .tab.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .panes { flex: 1; overflow: auto; padding: 12px; }
  .pane { display: none; flex-direction: column; gap: 12px; }
  .pane.on { display: flex; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .card h3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 10px; font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .card h3 small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); }
  .note { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fields .full { grid-column: 1 / -1; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row > .grow { flex: 1; }

  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field > span { font-size: 11px; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; }
  .field > span em { font-style: normal; color: var(--fg); font-family: var(--mono); }
  .field input:not([type=checkbox]):not([type=range]):not([type=color]), .field select, .field textarea, .input {
    height: 30px; width: 100%; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); outline: none; transition: border-color .15s, box-shadow .15s; }
  .field textarea { height: 70px; padding: 6px 8px; resize: vertical; font: 12px/1.4 var(--mono); }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .suffix { position: relative; }
  .suffix input { padding-right: 34px !important; }
  .suffix::after { content: attr(data-unit); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 11px; pointer-events: none; }
  input[type=number] { font-family: var(--mono); font-size: 12px; -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg); cursor: pointer; min-height: 22px; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 999px; background: var(--raise); outline: none; margin: 8px 0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--accent); border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--accent); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: 3px solid var(--panel); cursor: pointer; }
  .sep { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 2px 0; }
  .sub { grid-column: 1 / -1; font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .05em; text-transform: uppercase; margin-top: 4px; }
  .map { display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1; }
  .map-row { display: flex; align-items: center; gap: 8px; }
  .sw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line-2); flex: none; }
  .map-row .mono { font-size: 11px; color: var(--muted); width: 62px; }
  .map-row select { flex: 1; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); padding: 0 6px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; gap: 3px; border-radius: 9px; background: var(--raise); border: 1px solid var(--line); }
  .seg button { height: 26px; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; font-size: 11.5px; font-weight: 500; }
  .seg button.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; grid-column: 1 / -1; }
  .modes button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 6px; border-radius: 9px; border: 1px solid var(--line); background: var(--raise); color: var(--muted); cursor: pointer; font-size: 10.5px; font-weight: 500; }
  .modes button svg { width: 22px; height: 22px; }
  .modes button.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--raise)); }

  /* menus + modals */
  .menu { position: fixed; z-index: 30; min-width: 190px; padding: 5px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 16px 40px rgba(0,0,0,.35); display: none; }
  .menu.show { display: block; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 7px 10px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-size: 12.5px; text-align: left; }
  .menu button:hover { background: var(--raise); }
  .menu button svg { width: 15px; height: 15px; color: var(--muted); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
  .modal-bg { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(5, 7, 12, .55); backdrop-filter: blur(3px); padding: 16px; }
  .modal-bg.show { display: grid; }
  .modal { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; border-radius: 16px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .modal header { display: flex; align-items: center; padding: 16px 18px 6px; }
  .modal header h2 { margin: 0; font-size: 16px; font-weight: 650; flex: 1; }
  .modal .body { padding: 8px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
  .step { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 11px; background: var(--panel-2); border: 1px solid var(--line); }
  .step.cur { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .step.done { opacity: .6; }
  .step .sw { width: 28px; height: 28px; border-radius: 8px; }
  .step b { display: block; font-weight: 600; }
  .step span { font-size: 11.5px; color: var(--muted); }
  .bar { height: 5px; border-radius: 999px; background: var(--raise); overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #ff7ab6); transition: width .3s; }
  .callout { padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 12%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); font-size: 12.5px; }
  .callout.bad { background: color-mix(in srgb, var(--danger) 12%, transparent); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }

  #toast { position: fixed; left: 50%; top: 64px; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; z-index: 40;
    max-width: min(560px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 10px; font-size: 13px;
    background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 12px 40px rgba(0,0,0,.35); transition: opacity .2s, transform .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.bad { border-color: color-mix(in srgb, var(--danger) 60%, var(--line-2)); color: var(--danger); }
  input[type=file] { display: none; }

  @media (max-width: 1100px) {
    html, body { height: auto; }
    body { min-height: 100%; overflow: visible; grid-template-rows: auto auto; }
    .app { grid-template-columns: 1fr; min-height: auto; }
    .left > .sect { flex: none; }
    .stage { height: 70vh; min-height: 380px; order: -1; }
    .left, .right { border: 0; border-top: 1px solid var(--line); overflow: visible; }
    .panes { overflow: visible; padding: 12px 16px; }
    .sect { padding: 14px 16px; }
    .tabs { padding: 12px 16px 0; }
    .brand small { display: none; }
  }
  @media (max-width: 560px) {
    .topbar { flex-wrap: wrap; padding: 10px 16px; }
    #mchip { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3-6 6-6 9 0s6 6 9 0"/><path d="M3 9c3-6 6-6 9 0s6 6 9 0" opacity=".5"/></svg>
    </div>
    <div><h1>Plot Studio</h1><small>Images &amp; vectors → pen-plotter G-code</small></div>
  </div>
  <a href="/" class="btn ghost" id="lnkCtl" hidden>Controller</a>
  <div class="chip" id="mchip" hidden><i></i><span id="mstate">—</span></div>
  <button class="btn" id="btnOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>Import</button>
  <button class="btn" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>Export</button>
  <button class="btn primary" id="btnPlot" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>Plot</button>
</header>

<div class="app">
  <!-- ================= left: objects + pens ================= -->
  <aside class="left">
    <div class="sect">
      <div class="sect-h"><span class="grow">Objects</span>
        <button class="btn sm" id="btnAdd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button>
      </div>
      <div class="list" id="objList"></div>
    </div>
    <div class="sect">
      <div class="sect-h"><span class="grow">Pens <small>· plot order</small></span>
        <button class="btn sm" id="btnAddPen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Pen</button>
      </div>
      <div class="list" id="penList"></div>
      <p class="note">Each pen is plotted as its own pass. Swap pens between passes.</p>
    </div>
  </aside>

  <!-- ================= stage ================= -->
  <section class="stage">
    <div class="canvas-wrap" id="wrap">
      <canvas id="cv"></canvas>

      if (st.work && (st.work[0] !== S.machine.bedW || st.work[1] !== S.machine.bedH)) { S.machine.bedW = st.work[0]; S.machine.bedH = st.work[1]; renderMach(); fitView(); computePlan(); }
    }

  if (R.busy && R.started && !j.running) {   // job finished
    R.busy = false;
    if (j.error) R.error = j.error; else { R.done.add(R.i); R.i++; }
  }
  $('modal').querySelectorAll('.step').forEach(s => {
    const i = +s.dataset.i, bar = s.querySelector('.bar'), cur = i === R.i && R.i < R.list.length;
    s.classList.toggle('cur', cur); s.classList.toggle('done', R.done.has(i));
    bar.hidden = !(cur && R.busy);
    if (cur && R.busy && j.total) bar.firstElementChild.style.width = (j.sent / j.total * 100) + '%';
    s.querySelector('[data-stat]').textContent = R.done.has(i) ? '✓ done' : cur && R.busy ? (j.total ? Math.round(j.sent / j.total * 100) + '%' : 'starting…') : '';
  });
  const fin = R.i >= R.list.length, pp = R.list[R.i];
  $('plErr').innerHTML = R.error ? `<div class="callout bad">${esc(R.error)}</div>` : '';
  $('plPrompt').innerHTML = fin ? '<b>All done.</b> The pen is up and parked.' : R.busy ? `Plotting with <b>${esc(pp.pen.name)}</b>…` : `${R.i ? 'Swap to' : 'Load'} the <b style="color:${pp.pen.color}">●</b> <b>${esc(pp.pen.name)}</b> pen, then press Plot.`;
  $('plGo').disabled = fin || R.busy || !(server.st && server.st.connected);
  $('plGo').textContent = fin ? 'Finished' : R.error ? `Retry ${pp.pen.name}` : `Plot ${pp.pen.name}`;
  $('plSkip').disabled = fin || R.busy; $('plStop').disabled = !R.busy;
}

const EXAMPLE_SRC = '';   // build_artifact.py embeds an image here for the hosted copy
async function loadExample() {
  if (!EXAMPLE_SRC) return;
  pens = [{id: 'pnavy', name: 'Navy', color: '#1f2f48', width: 0.4, on: true, down: '', feed: ''},
    {id: 'pgold', name: 'Gold', color: '#af9b5b', width: 0.4, on: true, down: '', feed: ''},
    {id: 'ppink', name: 'Pink', color: '#d6a3b2', width: 0.4, on: true, down: '', feed: ''}];
  await addImage('Great Wave (example)', EXAMPLE_SRC);
  const it = items[items.length - 1];
  Object.assign(it.opts, {mode: 'colors', colors: 7, detail: 450, outline: true, fill: true, tone: true, spacing: 0.7, smooth: true});
  await updatePalette(it);
  for (const e of it.palette) {   // keep the three ink colours; paper, foam and blended edges stay unplotted
    const near = pens.slice(0, 3).map(p => [p, colorDist(p.color, e.hex)]).sort((a, b) => a[1] - b[1])[0];
    e.pen = near[1] < 45 ? near[0].id : '';
  }
  pens = pens.slice(0, 3);
  renderPens(); renderInspector(); schedule(0);
}
