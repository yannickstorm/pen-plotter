<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plot Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;700&family=Pacifico&family=Bebas+Neue&family=Playfair+Display:wght@400;700&family=Roboto+Slab:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f12; --panel: #15181d; --panel-2: #1b1f26; --raise: #232832;
    --line: #2a303a; --line-2: #363d49;
    --fg: #eceff4; --muted: #8a93a3; --faint: #5b6372;
    --accent: #8b7bff; --accent-2: #b4a9ff; --accent-ink: #0d0b1f;
    --ok: #3ddc97; --warn: #ffb547; --danger: #ff5c6c;
    --paper: #fbfaf6; --mat: #101317; --bedfill: #1a1e24; --grid: rgba(40, 50, 80, .07);
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.35);
    --radius: 14px;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eceef2; --panel: #ffffff; --panel-2: #f5f6f9; --raise: #eef0f4;
      --line: #e1e4ea; --line-2: #d0d5de;
      --fg: #161a22; --muted: #5f6878; --faint: #9aa2b1;
      --accent: #5b47f5; --accent-2: #4636d6; --accent-ink: #ffffff;
      --mat: #dfe2e8; --bedfill: #cfd3db;
      --shadow: 0 1px 2px rgba(20,25,40,.06), 0 8px 24px rgba(20,25,40,.06);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
      --bg: #eceef2; --panel: #ffffff; --panel-2: #f5f6f9; --raise: #eef0f4;
      --line: #e1e4ea; --line-2: #d0d5de;
      --fg: #161a22; --muted: #5f6878; --faint: #9aa2b1;
      --accent: #5b47f5; --accent-2: #4636d6; --accent-ink: #ffffff;
      --mat: #dfe2e8; --bedfill: #cfd3db;
      --shadow: 0 1px 2px rgba(20,25,40,.06), 0 8px 24px rgba(20,25,40,.06);
      color-scheme: light;
  }
  * { box-sizing: border-box; }
  .pswatch { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line-2); cursor: pointer; padding: 0; position: relative; flex: none; }
  .pswatch.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
  .pswatch.custom { background: conic-gradient(#f66, #fd5, #6e8, #5bf, #a7f, #f66); overflow: hidden; }
  .pswatch.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .themeseg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
  .themeseg button { width: 30px; height: 26px; display: grid; place-items: center; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; }
  .themeseg button:hover { color: var(--fg); }
  .themeseg button.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .themeseg svg { width: 15px; height: 15px; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); }

  /* ---------- top bar ---------- */
  .verbar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 10px; max-width: min(720px, calc(100vw - 24px)); padding: 10px 12px 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--warn); box-shadow: var(--shadow, 0 8px 30px rgba(0,0,0,.25)); font-size: 12.5px; }
  .verbar[hidden] { display: none; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar .spacer { flex: 1; }
  .filebar { display: flex; align-items: center; gap: 6px; margin-left: 10px; padding-left: 14px; border-left: 1px solid var(--line); min-width: 0; }
  .filebar .btn svg.chev { width: 12px; height: 12px; opacity: .6; }
  .projname { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .projname b { color: var(--fg); font-weight: 600; }
  .menu kbd { margin-left: auto; padding-left: 18px; font: 11px var(--mono); color: var(--faint); }
  .menu .mh { padding: 6px 10px 3px; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
  .brand-mark { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none;
    background: linear-gradient(135deg, var(--accent), #ff7ab6); color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 40%, transparent); }
  .brand h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .brand small { display: block; color: var(--muted); font-size: 11.5px; margin-top: -1px; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .chip.idle i { background: var(--ok); } .chip.run i { background: var(--accent); animation: pulse 1s infinite; }
  .chip.hold i, .chip.busy i { background: var(--warn); } .chip.alarm i { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .4; } }
  button.chip { cursor: pointer; color: var(--fg); }
  a.btn { color: var(--fg); }
  button.chip:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line-2)); }
  .conn-opt { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .conn-opt.off { opacity: .6; }
  .conn-opt p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .conn-h { display: flex; align-items: center; gap: 8px; }
  .conn-h svg { width: 18px; height: 18px; color: var(--accent); flex: none; }
  .conn-h small { color: var(--faint); font-size: 11.5px; }
  .conn-now { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2); flex-wrap: wrap; }
  .conn-now .grow { flex: 1; min-width: 140px; }
  .conn-now b { display: block; font-size: 13px; overflow-wrap: anywhere; }
  .conn-now span { font-size: 12px; color: var(--muted); }
  .conn-now .chip { padding: 4px 9px 4px 8px; font-size: 11.5px; color: var(--fg); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 9px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--line-2); background: var(--raise); font-weight: 500; font-size: 12.5px; text-decoration: none;
    transition: background .15s, border-color .15s, transform .05s; }
  .btn:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line-2)); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--raise); }
  .btn.danger { color: var(--danger); }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
  .btn.icon { width: 28px; padding: 0; }
  .btn.block { width: 100%; }
  .btn svg { width: 15px; height: 15px; flex: none; }

  /* ---------- workspaces: Design (make the drawing) · Machine (set up and drive the plotter) · Plot (run and watch) ---------- */
  .wsseg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--panel-2); border: 1px solid var(--line); margin-left: 6px; }
  .wsseg button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; font-size: 12.5px; font-weight: 600; }
  .wsseg button:hover { color: var(--fg); }
  .wsseg button.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .wsseg button svg { width: 15px; height: 15px; }
  .wsseg button i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: none; }
  .wsseg button.live i { display: block; animation: pulse 1s infinite; }
  .wsseg button.warn i { display: block; background: var(--warn); }
  body:not([data-ws=design]) .app > [data-ws=design], body:not([data-ws=machine]) .app > [data-ws=machine], body:not([data-ws=plot]) .app > [data-ws=plot],
  body:not([data-ws=design]) [data-only=design] { display: none !important; }
  .app > .left { grid-column: 1; grid-row: 1; } .app > .stage { grid-column: 2; grid-row: 1; } .app > .right { grid-column: 3; grid-row: 1; }
  body:not([data-ws=design]) .app { grid-template-columns: 320px minmax(0, 1fr) 330px; }
  .left[data-ws], .right[data-ws] { overflow: auto; }
  .ws-panes { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
  .kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .kv > div { padding: 7px 9px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
  .kv span { display: block; font-size: 10.5px; color: var(--muted); }
  .kv b { font: 500 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .bigbar { height: 9px; border-radius: 999px; background: var(--raise); overflow: hidden; margin: 10px 0; }
  .bigbar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #ff7ab6); transition: width .35s; }
  .bigbar.bad > div { background: var(--danger); } .bigbar.ok > div { background: var(--ok); }
  .livehead { display: flex; align-items: baseline; gap: 10px; }
  .livehead b { font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-family: var(--mono); }
  .livehead span { color: var(--muted); font-size: 12px; }
  .jog { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 5px; }
  .jog .btn { height: 100%; padding: 0; border-radius: 10px; font-size: 15px; }
  .jog .btn.mid { font-size: 10.5px; color: var(--muted); }
  .console { height: 210px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; font: 11.5px/1.55 var(--mono); }
  .console div { white-space: pre-wrap; word-break: break-word; color: var(--muted); }
  .console .tx { color: var(--accent); } .console .err { color: var(--danger); } .console .sys { color: var(--fg); }
  .console.short { height: 150px; }
  .card.recover { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 12%, transparent); }
  .rsteps { margin: 10px 0 0; padding: 0; list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 10px; }
  .rsteps li { counter-increment: st; display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 12.5px; }
  .rsteps li::before { content: counter(st); width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--sans); background: var(--raise); color: var(--muted); }
  .rsteps .row { margin-top: 6px; }
  .rsub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .rsub b { font: 500 12px var(--mono); color: var(--fg); }
  .ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .bad-t { color: var(--danger); }
  .picker { display: inline-flex; align-items: center; gap: 6px; }
  .picker .btn { width: 30px; padding: 0; }
  .picker span { font: 500 12px var(--mono); min-width: 104px; text-align: center; }
  .step .st { font: 500 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .step.int { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
  .step.skip { opacity: .5; }
  .demo-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  /* machine list (device cards), wizard */
  .mcard { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; }
  .mcard:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line-2)); }
  .mcard.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
  .mc-ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--raise); color: var(--muted); }
  .mc-ic svg { width: 20px; height: 20px; } .mcard.on .mc-ic { color: var(--accent); }
  .mc-body { min-width: 0; } .mc-body > b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mc-body > span { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mc-st { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11.5px; color: var(--muted); } .mc-st span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.idle { background: var(--ok); } .dot.run { background: var(--accent); animation: pulse 1s infinite; } .dot.hold { background: var(--warn); } .dot.alarm { background: var(--danger); }
  .mc-bar { height: 4px; border-radius: 99px; background: var(--raise); overflow: hidden; margin-top: 6px; } .mc-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), #ff7ab6); }
  .mc-err { font-size: 11.5px; color: var(--danger); margin-top: 4px; } .mc-hint { font-size: 11.5px; color: var(--warn); margin-top: 3px; } .mc-hint a { color: inherit; }
  .mc-act { display: flex; align-items: center; gap: 4px; }
  .mstrip { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 10px; }
  .mstrip .grow { min-width: 0; } .mstrip b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .mstrip span { display: block; font-size: 11.5px; color: var(--muted); }
  /* the wizard sits beside the bed instead of over it, so you can watch the pen while you set it up */
  .modal-bg.docked { background: transparent; backdrop-filter: none; pointer-events: none; place-items: center end; }
  .modal-bg.docked .modal { pointer-events: auto; width: min(450px, 100%); max-height: calc(100vh - 32px); }
  @media (max-width: 1000px) { .modal-bg.docked { background: rgba(5, 7, 12, .55); backdrop-filter: blur(3px); pointer-events: auto; place-items: center; } .modal-bg.docked .modal { width: min(520px, 100%); } }
  .wz-steps { display: flex; gap: 6px; padding: 4px 18px 6px; }
  .wz-steps span { flex: 1; text-align: center; padding-top: 7px; border-top: 3px solid var(--line); font-size: 11px; font-weight: 600; color: var(--faint); }
  .wz-steps span.on { color: var(--accent); border-color: var(--accent); } .wz-steps span.done { color: var(--muted); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .wz-lead { margin: 0; font-size: 13.5px; font-weight: 600; }
  .wz-opts { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .wz-opt { display: grid; grid-template-columns: 26px 1fr; column-gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; text-align: left; }
  .wz-opt svg { width: 22px; height: 22px; color: var(--muted); grid-row: 1 / 3; } .wz-opt b { font-size: 13px; } .wz-opt span { font-size: 11.5px; color: var(--muted); grid-column: 2; }
  .wz-opt:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line-2)); }
  .wz-opt.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); } .wz-opt.on svg { color: var(--accent); }
  .wz-row { display: grid; grid-template-columns: 78px minmax(0, 1fr) 72px auto; gap: 8px; align-items: center; margin: 6px 0; font-size: 12.5px; }
  .wz-row input[type=range] { margin: 0; }
  .wz-foot { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .wz-glyph { width: 56px; height: 72px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); flex: none; }
  @media (max-width: 560px) { .wz-row { grid-template-columns: 64px minmax(0, 1fr) 64px auto; } }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 270px minmax(0, 1fr) 330px; min-height: 0; }
  .left, .right { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .left { border-right: 1px solid var(--line); overflow: auto; }
  .right { border-left: 1px solid var(--line); }
  .sect { padding: 14px; border-bottom: 1px solid var(--line); }
  .sect-h { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .sect-h .grow { flex: 1; }
  .sect-h small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); }

  .list { display: flex; flex-direction: column; gap: 4px; }
  .obj { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
  .obj:hover { background: var(--panel-2); }
  .obj.on { background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .obj .ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--raise); color: var(--muted); flex: none; }
  .obj .ic svg { width: 14px; height: 14px; }
  .obj .nm { flex: 1; min-width: 0; }
  .obj .nm b { display: block; font-weight: 500; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .obj .nm span { font-size: 11px; color: var(--faint); }
  .obj .eye { opacity: .5; } .obj .eye:hover { opacity: 1; }
  .obj.hid .nm { opacity: .45; }
  .empty { padding: 14px; border: 1.5px dashed var(--line-2); border-radius: 12px; color: var(--muted); font-size: 12px; text-align: center; }
  .empty b { display: block; color: var(--fg); font-size: 13px; margin-bottom: 4px; }

  .pen { border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); padding: 8px; }
  .pen-top { display: flex; align-items: center; gap: 8px; }
  .pen-top input[type=color] { width: 26px; height: 26px; border: 0; padding: 0; border-radius: 7px; background: none; cursor: pointer; flex: none; }
  .pen-top input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .pen-top input[type=color]::-webkit-color-swatch { border: 1px solid var(--line-2); border-radius: 7px; }
  .pen-top .pname { flex: 1; min-width: 0; height: 26px; border: 1px solid transparent; background: none; border-radius: 6px; padding: 0 6px; font-weight: 500; }
  .pen-top .pname:hover, .pen-top .pname:focus { border-color: var(--line-2); background: var(--panel); outline: none; }
  .pen-num { font: 600 11px var(--mono); color: var(--faint); width: 14px; text-align: center; }
  .pen-meta { font-size: 11px; color: var(--faint); margin: 4px 0 0 22px; font-family: var(--mono); }
  .pen-more { display: none; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .pen.open .pen-more { display: grid; }
  .pen.off { opacity: .55; }

  .stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .canvas-wrap { position: relative; flex: 1; min-height: 0; background: var(--mat); overflow: hidden; }
  .canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .canvas-wrap.drop { outline: 2px dashed var(--accent); outline-offset: -8px; }
  .hud { position: absolute; display: flex; gap: 6px; align-items: center; }
  .hud.tl { left: 12px; top: 12px; pointer-events: none; }
  .hud.tr { right: 12px; top: 12px; }
  .hud.bl { left: 12px; bottom: 12px; right: 12px; flex-wrap: wrap; }
  .pill { padding: 5px 10px; border-radius: 8px; font: 11.5px var(--mono); color: var(--muted);
    background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--line); white-space: nowrap; }
  .pill b { color: var(--fg); font-weight: 500; }
  .tools { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--line); }
  .tools button { height: 28px; min-width: 28px; padding: 0 8px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .tools button:hover { color: var(--fg); background: var(--raise); }
  .tools button.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .tools button svg { width: 15px; height: 15px; }
  .sim { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px; padding: 3px 10px 3px 3px; }
  .sim input { flex: 1; margin: 0; }
  .busy { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: none; }
  .hud.mt { right: 12px; top: 52px; flex-direction: column; align-items: flex-end; }
  #mKm { font-size: 11.5px; color: var(--fg); min-width: 52px; text-align: center; align-self: center; }
  #mHint { max-width: 280px; white-space: normal; text-align: right; font: 11.5px/1.4 var(--sans); }
  #mHint.warn { color: var(--warn); }
  .busy.show { display: block; }
  .busy .pill { color: var(--accent); }

  .statusbar { display: flex; gap: 18px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); overflow-x: auto; white-space: nowrap; }
  .statusbar b { color: var(--fg); font: 500 12px var(--mono); }
  .statusbar .warn { color: var(--warn); }

  details.rel, details.alt { border-top: 1px solid var(--line); padding: 8px 0; }
  details.rel summary, details.alt summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; }
  details.rel summary::-webkit-details-marker, details.alt summary::-webkit-details-marker { display: none; }
  .relnotes { white-space: pre-wrap; font-size: 12px; color: var(--muted); margin: 8px 0 2px; max-height: 220px; overflow: auto; }
  .cmd { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .cmd code { flex: 1; font-size: 11.5px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); overflow-x: auto; white-space: nowrap; user-select: all; }
  .rtag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .rtag.ok { background: color-mix(in srgb, #1a8f5a 16%, transparent); color: #1a8f5a; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 12px 12px 0; }
  .tab, .mtab { padding: 8px 0; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; border-radius: 9px; }
  .tab:hover, .mtab:hover { background: var(--panel-2); color: var(--fg); }
  .tab.on, .mtab.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .mtab { border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; border-radius: 9px; }
  .panes { flex: 1; overflow: auto; padding: 12px; }
  .pane { display: none; flex-direction: column; gap: 12px; }
  .pane.on { display: flex; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .card h3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 10px; font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .card h3 small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); }
  .note { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fields .full { grid-column: 1 / -1; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row > .grow { flex: 1; }

  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field > span { font-size: 11px; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; }
  .field > span em { font-style: normal; color: var(--fg); font-family: var(--mono); }
  .field input:not([type=checkbox]):not([type=range]):not([type=color]), .field select, .field textarea, .input {
    height: 30px; width: 100%; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); outline: none; transition: border-color .15s, box-shadow .15s; }
  .field textarea { height: 70px; padding: 6px 8px; resize: vertical; font: 12px/1.4 var(--mono); }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .suffix { position: relative; }
  .suffix input { padding-right: 34px !important; }
  .suffix::after { content: attr(data-unit); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 11px; pointer-events: none; }
  input[type=number] { font-family: var(--mono); font-size: 12px; -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg); cursor: pointer; min-height: 22px; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 999px; background: var(--raise); outline: none; margin: 8px 0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--accent); border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--accent); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: 3px solid var(--panel); cursor: pointer; }
  .sep { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 2px 0; }
  .sub { grid-column: 1 / -1; font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .05em; text-transform: uppercase; margin-top: 4px; }
  .map { display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1; }
  .map-row { display: flex; align-items: center; gap: 8px; }
  .sw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line-2); flex: none; }
  .map-row .mono { font-size: 11px; color: var(--muted); width: 62px; }
  .map-row select { flex: 1; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); padding: 0 6px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; gap: 3px; border-radius: 9px; background: var(--raise); border: 1px solid var(--line); }
  .seg button { height: 26px; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; font-size: 11.5px; font-weight: 500; }
  .seg button.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; grid-column: 1 / -1; }
  .modes button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 6px; border-radius: 9px; border: 1px solid var(--line); background: var(--raise); color: var(--muted); cursor: pointer; font-size: 10.5px; font-weight: 500; }
  .modes button svg { width: 22px; height: 22px; }
  .modes button.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--raise)); }

  /* menus + modals */
  .menu { position: fixed; z-index: 30; min-width: 190px; padding: 5px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 16px 40px rgba(0,0,0,.35); display: none; }
  .menu.show { display: block; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 7px 10px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-size: 12.5px; text-align: left; }
  .menu button:hover { background: var(--raise); }
  .menu button svg { width: 15px; height: 15px; color: var(--muted); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
  .modal-bg { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(5, 7, 12, .55); backdrop-filter: blur(3px); padding: 16px; }
  .modal-bg.show { display: grid; }
  .modal { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; border-radius: 16px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .modal header { display: flex; align-items: center; padding: 16px 18px 6px; }
  .modal header h2 { margin: 0; font-size: 16px; font-weight: 650; flex: 1; }
  .modal .body { padding: 8px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
  .step { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 11px; background: var(--panel-2); border: 1px solid var(--line); }
  .step.cur { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .step.done { opacity: .6; }
  .step .sw { width: 28px; height: 28px; border-radius: 8px; }
  .step b { display: block; font-weight: 600; }
  .step span { font-size: 11.5px; color: var(--muted); }
  .bar { height: 5px; border-radius: 999px; background: var(--raise); overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #ff7ab6); transition: width .3s; }
  .callout { padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 12%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); font-size: 12.5px; }
  .callout.bad { background: color-mix(in srgb, var(--danger) 12%, transparent); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }

  #toast { position: fixed; left: 50%; top: 64px; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; z-index: 40;
    max-width: min(560px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 10px; font-size: 13px;
    background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 12px 40px rgba(0,0,0,.35); transition: opacity .2s, transform .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.act { pointer-events: auto; display: flex; align-items: center; gap: 14px; }
  #toast .tact { border: 0; background: none; color: var(--accent); font: 600 13px var(--sans); cursor: pointer; padding: 2px 0; }
  .histbtns { display: inline-flex; gap: 2px; }
  .histbtns .btn { width: 32px; padding: 0; }
  .histbtns .btn:disabled { opacity: .3; }
  .obj .off { font-size: 10.5px; font-weight: 600; color: var(--warn); margin-left: 4px; }
  .obj .back { height: 22px; padding: 0 7px; font-size: 11px; border-radius: 6px; }
  .geoprog { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
  .gp-head { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .gp-head b { flex: 1; font-weight: 600; }
  .gp-head .mono { font-size: 11px; color: var(--muted); }
  .gp-bar { margin: 0; }
  .gp-bar.ind > div { min-width: 18%; background-image: linear-gradient(90deg, var(--accent), #ff7ab6, var(--accent)); background-size: 200% 100%; animation: gpslide 1.2s linear infinite; }
  @keyframes gpslide { to { background-position: -200% 0; } }
  .gp-step { display: grid; grid-template-columns: 16px 1fr; column-gap: 6px; align-items: baseline; font-size: 12px; }
  .gp-step .gp-text { grid-column: 2; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
  .gp-step .gp-text:empty { display: none; }
  .gp-step.wait .gp-name, .gp-step.skip .gp-name { color: var(--faint); }
  .gp-step.fail .gp-text { color: var(--danger); }
  .gp-spin { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: gpspin .8s linear infinite; }
  @keyframes gpspin { to { transform: rotate(360deg); } }
  #toast.bad { border-color: color-mix(in srgb, var(--danger) 60%, var(--line-2)); color: var(--danger); }
  input[type=file] { display: none; }

  @media (max-width: 1100px) {
    html, body { height: auto; }
    body { min-height: 100%; overflow: visible; grid-template-rows: auto auto; }
    .app, body:not([data-ws=design]) .app { grid-template-columns: 1fr; min-height: auto; }
    .app > .left, .app > .stage, .app > .right { grid-column: 1; grid-row: auto; }
    .left[data-ws], .right[data-ws] { overflow: visible; }
    body:not([data-ws=design]) .stage { height: 52vh; height: 52svh; min-height: 300px; }
    .left > .sect { flex: none; }
    .stage { height: 70vh; height: 70svh; min-height: 380px; order: -1; }
    .left, .right { border: 0; border-top: 1px solid var(--line); overflow: visible; }
    .panes { overflow: visible; padding: 12px 16px; }
    .sect { padding: 14px 16px; }
    .tabs { padding: 12px 16px 0; }
    .brand small { display: none; }
    .projname { max-width: 160px; }
  }
  @media (max-width: 560px) {
    .topbar { flex-wrap: wrap; padding: 10px 16px; }
    .wsseg { order: 10; width: 100%; margin: 0; } .wsseg button { flex: 1; justify-content: center; }
    #themeSeg { display: none; }
    #mchip { padding: 6px 10px; }
    .projname { display: none; }
    .filebar { margin-left: 4px; padding-left: 8px; }
  }
</style>
</head>
<body data-ws="design">
<div class="verbar" id="verBar" hidden></div>
<header class="topbar">

  <!-- ================= stage ================= -->

      <div class="hud mt" id="mapTools" data-only="design" hidden>
        <div class="tools">
          <button id="mEdit" title="Move and zoom the map inside its frame (or double-click the map)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>Move map</button>

          <button id="tSource" title="Show the source image under its lines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>Source</button>

// =====================================================================
// Rows of short dashes, each row plotted with a different servo wait. Long vertical guide lines
// (plotted first, with a generous wait) mark where every dash must start and end:
//  · gap between the left guide and the dash start → pen lands late  (wait too short going down)

// ---------- machines: the plotters you have set up ----------

const fmtWhen = t => t ? new Date(t * 1000).toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'}) : '—';
const MIC = {
  bridge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="10" rx="2"/><path d="M8 18h8M12 14v4M8 9h.01M12 9h4"/></svg>',
  usb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M8 7l4-4 4 4M7 12v3l5 3 5-3v-3"/><circle cx="12" cy="19" r="2"/></svg>',
  demo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 14l3-4 3 3 4-5"/></svg>',
  dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',

function loadProfile(m) {   // make a machine's settings the studio's working settings (the design follows the machine)
  const p = profileOf(m), M = S.machine;

}

}
let pushTimer = null, syncing = false;

  const m = activeMachine(); if (!m) return;

  try {

    m.rev = r.machine.rev; m.dirty = false; saveMachines(); renderMachineViews();

    <div class="row"><button class="btn primary grow" id="cfBridge">Use the bridge’s settings</button><button class="btn grow" id="cfMine">Overwrite the bridge with mine</button></div></div>`);
